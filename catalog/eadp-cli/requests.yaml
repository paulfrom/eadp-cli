- id: bpm-find-by-page
  name: bpm.findByPage
  domain: bpm
  title: BPM 资源分页查询
  description: BPM inspect 使用的只读查询请求，仅登记查询能力，不登记保存和关系写入接口。
  method: POST
  path: /api-gateway/sei-bpm/{resource}/findByPage
  permission: read
  risk: low
  callable: false
  source: src/bpm/client.ts
  resourceExamples:
    - conBusinessModule
    - conBusinessEntity
    - conPage
    - conInterface
    - conFlowType
  requestSchema:
    type: object
    additionalProperties: true
    required:
      - pageInfo
      - filters
    properties:
      pageInfo:
        type: object
        required:
          - page
          - rows
      filters:
        type: array
