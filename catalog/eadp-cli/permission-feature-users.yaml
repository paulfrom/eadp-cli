id: permission-feature-effective-users
name: permission.feature.effectiveUsers
domain: permission
title: 按功能代码反查最终有效用户
description: 枚举租户用户并调用 checkUserFeaturesAuthority，包含直接角色、岗位和岗位类别继承权限。
method: POST
path: /api-gateway/sei-basic/user/checkUserFeaturesAuthority
permission: read
risk: low
callable: false
source: src/commands/permission.ts
requestSchema:
  type: object
  additionalProperties: false
  required:
    - userId
    - featureCodes
  properties:
    userId:
      type: string
    featureCodes:
      type: array
      minItems: 1
      items:
        type: string
