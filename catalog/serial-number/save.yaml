id: serial-number-config-save
name: serialNumberConfig.save
domain: serial-number
title: 保存给号服务配置
description: 新增或更新实体的流水号与编码生成规则
method: POST
path: /api-gateway/sei-basic/serialNumberConfig/save
permission: write
risk: high
requestSchema:
  type: object
  additionalProperties: true
  required:
    - appModuleCode
    - appModuleName
    - entityClassName
    - configType
    - name
    - expressionConfig
    - minNumber
    - maxNumber
    - useDeleted
    - cycleStrategy
    - activated
    - genFlag
    - publicFlag
    - tenantIsolation
    - configItem
  properties:
    id:
      type: string
      description: 配置 ID；更新时必填
    appModuleCode:
      type: string
      description: 应用模块编码
    appModuleName:
      type: string
      description: 应用模块名称
    entityClassName:
      type: string
      description: 使用给号规则的实体完整类名
    configType:
      type: string
      enum: [CODE_TYPE, BAR_TYPE]
      description: 配置类型；CODE_TYPE 为主数据编号，BAR_TYPE 为条码
    name:
      type: string
      description: 给号规则名称
    expressionConfig:
      type: string
      description: 编码表达式，例如 '#{00000}'
    minNumber:
      type: integer
      minimum: 0
      description: 最小流水号
    maxNumber:
      type: integer
      minimum: 0
      description: 最大流水号；0 表示不限制
    useDeleted:
      type: boolean
      description: 是否复用已删除记录的号码
    cycleStrategy:
      type: string
      enum: [MAX_CYCLE, DAY_CYCLE, MONTH_CYCLE, YEAR_CYCLE]
      description: 循环策略；分别为达到最大号循环、按日循环、按月循环、按年循环
    returnStrategy:
      type:
        - string
        - "null"
      enum: [NEW, REPEAT, PATCH, null]
      description: 返回策略；NEW 每次新给号，REPEAT 对同一关联对象优先返回已有条码，PATCH 为补号策略；新增时缺失、null 或空白默认 NEW
    activated:
      type: boolean
      description: 是否启用
    genFlag:
      type: boolean
      description: 是否允许生成
    tenantCode:
      type: string
      description: 租户编码；CLI 始终使用 env add 校验并保存的 tenantCode 覆盖该值
    publicFlag:
      type: boolean
      description: 是否为公共配置
    tenantIsolation:
      type: boolean
      description: 是否启用租户隔离
    isolationExpression:
      type: string
      description: 隔离表达式
    configItem:
      type: array
      minItems: 1
      description: 编码表达式组成项
      items:
        type: object
        additionalProperties: true
        required:
          - elementName
          - elementCode
          - elementValue
          - isolation
          - linkCharacter
          - sort
        properties:
          id:
            type: string
            description: 配置项 ID
          configId:
            type: string
            description: 所属配置 ID
          elementName:
            type: string
            description: 元素名称
          elementCode:
            type: string
            description: 元素编码；内置 DefaultElement 完整取值为 FIXED_CODE（固定编码）、DATE_CODE（日期编码）、SERIAL_CODE（流水号编码），也可使用目标服务已登记的自定义元素代码
          elementValue:
            type: string
            description: 元素值
          isolation:
            type: boolean
            description: 是否作为隔离条件
          linkCharacter:
            type: string
            enum: [EMPTY, DASH, DOT, PIPE, COLON]
            description: 连接字符；EMPTY 为空、DASH 为短横线、DOT 为点、PIPE 为竖线、COLON 为冒号
          sort:
            type: integer
            description: 排序号
example:
  id: FB08F00B-B24A-11EC-A8BB-0242C0A84502
  appModuleCode: BASIC
  appModuleName: 基础应用
  entityClassName: com.changhong.sei.basic.entity.PositionCategory
  configType: CODE_TYPE
  name: 岗位类别
  expressionConfig: "#{00000}"
  minNumber: 2
  maxNumber: 0
  useDeleted: false
  cycleStrategy: MAX_CYCLE
  returnStrategy: null
  activated: true
  genFlag: true
  tenantCode: global
  publicFlag: true
  tenantIsolation: true
  isolationExpression: ""
  configItem:
    - elementName: 流水号编码
      elementCode: SERIAL_CODE
      elementValue: "5"
      isolation: false
      linkCharacter: EMPTY
      sort: 0
