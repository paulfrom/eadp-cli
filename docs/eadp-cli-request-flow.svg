<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1320" width="1120" height="1320">
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .lane-title { font-size: 13px; font-weight: 700; fill: #4b5563; letter-spacing: 0.08em; }
    .node-title { font-size: 15px; font-weight: 600; fill: #111827; }
    .node-subtitle { font-size: 12px; fill: #6b7280; }
    .edge-label { font-size: 12px; font-weight: 600; }
    .note { font-size: 12px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1120" height="1320" fill="#ffffff"/>
  <text x="560" y="46" text-anchor="middle" class="title">EADP CLI 环境与请求流程</text>
  <text x="560" y="72" text-anchor="middle" class="subtitle">每个环境名称直接绑定一个 URL 和一个 Token，可设置一个默认环境</text>
  <rect x="60" y="100" width="1000" height="150" rx="12" fill="#eff6ff" fill-opacity="0.58" stroke="#bfdbfe" stroke-dasharray="7,5"/>
  <text x="82" y="125" class="lane-title">输入与环境解析</text>
  <rect x="60" y="275" width="1000" height="345" rx="12" fill="#fff7ed" fill-opacity="0.42" stroke="#fed7aa" stroke-dasharray="7,5"/>
  <text x="82" y="300" class="lane-title">环境与 TOKEN 解析</text>
  <rect x="60" y="645" width="1000" height="570" rx="12" fill="#f0fdf4" fill-opacity="0.46" stroke="#bbf7d0" stroke-dasharray="7,5"/>
  <text x="82" y="670" class="lane-title">校验、请求与输出</text>
  <g id="command" data-graph-role="node">
    <rect x="110" y="145" width="220" height="70" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="220.0" y="176" text-anchor="middle" class="node-title">用户执行命令</text>
    <text x="220.0" y="197" text-anchor="middle" class="node-subtitle">api call / request / skill</text>
  </g>
  <g id="environment" data-graph-role="node">
    <rect x="450" y="145" width="220" height="70" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="560.0" y="176" text-anchor="middle" class="node-title">解析目标环境</text>
    <text x="560.0" y="197" text-anchor="middle" class="node-subtitle">--env 优先，否则 currentEnvironment</text>
  </g>
  <g id="load-config" data-graph-role="node">
    <rect x="790" y="145" width="220" height="70" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="900.0" y="176" text-anchor="middle" class="node-title">读取环境配置</text>
    <text x="900.0" y="197" text-anchor="middle" class="node-subtitle">环境名称、baseUrl、token</text>
  </g>
  <g id="environment-priority" data-graph-role="node">
    <rect x="170" y="335" width="360" height="115" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.8"/>
    <text x="350.0" y="366" text-anchor="middle" class="node-title">选择目标环境</text>
    <text x="350.0" y="387" text-anchor="middle" class="node-subtitle">1. --env 指定  2. 默认环境</text>
  </g>
  <g id="environment-found" data-graph-role="node">
    <polygon points="720,330 845,392 720,454 595,392" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="720" y="397" text-anchor="middle" class="node-title">环境配置有效？</text>
  </g>
  <g id="environment-error" data-graph-role="node">
    <rect x="855" y="510" width="170" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
    <text x="940.0" y="541" text-anchor="middle" class="node-title">停止执行</text>
    <text x="940.0" y="562" text-anchor="middle" class="node-subtitle">列出可用环境并返回非零状态</text>
  </g>
  <g id="resolve-token" data-graph-role="node">
    <rect x="170" y="510" width="360" height="72" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.8"/>
    <text x="350.0" y="541" text-anchor="middle" class="node-title">解析环境 Token</text>
    <text x="350.0" y="562" text-anchor="middle" class="node-subtitle">支持直接值或 ${ENV_VAR} 引用</text>
  </g>
  <g id="token-found" data-graph-role="node">
    <polygon points="720,484 845,546 720,608 595,546" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="720" y="551" text-anchor="middle" class="node-title">Token 可用？</text>
  </g>
  <g id="validate-input" data-graph-role="node">
    <rect x="120" y="700" width="280" height="78" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="260.0" y="731" text-anchor="middle" class="node-title">校验接口与请求参数</text>
    <text x="260.0" y="752" text-anchor="middle" class="node-subtitle">Zod 校验定义，Ajv 校验 Body</text>
  </g>
  <g id="high-risk" data-graph-role="node">
    <polygon points="590,677 710,739 590,801 470,739" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="590" y="744" text-anchor="middle" class="node-title">高风险操作？</text>
  </g>
  <g id="confirm" data-graph-role="node">
    <rect x="790" y="700" width="230" height="78" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="905.0" y="731" text-anchor="middle" class="node-title">确认或 Dry Run</text>
    <text x="905.0" y="752" text-anchor="middle" class="node-subtitle">写入、删除、发布必须确认</text>
  </g>
  <g id="build-request" data-graph-role="node">
    <rect x="450" y="845" width="280" height="86" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="590.0" y="876" text-anchor="middle" class="node-title">组装 HTTP 请求</text>
    <text x="590.0" y="897" text-anchor="middle" class="node-subtitle">baseUrl + path；注入 x-api-token</text>
  </g>
  <g id="send-request" data-graph-role="node">
    <rect x="790" y="845" width="250" height="86" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.8"/>
    <text x="915.0" y="876" text-anchor="middle" class="node-title">发送请求</text>
    <text x="915.0" y="897" text-anchor="middle" class="node-subtitle">fetch + 超时 + JSON 解析</text>
  </g>
  <g id="success" data-graph-role="node">
    <polygon points="590,945 715,1010 590,1075 465,1010" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="590" y="1015" text-anchor="middle" class="node-title">HTTP 与业务成功？</text>
  </g>
  <g id="success-output" data-graph-role="node">
    <rect x="300" y="1125" width="250" height="72" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <text x="425.0" y="1156" text-anchor="middle" class="node-title">格式化成功结果</text>
    <text x="425.0" y="1177" text-anchor="middle" class="node-subtitle">人类可读或 --json；退出码 0</text>
  </g>
  <g id="failure-output" data-graph-role="node">
    <rect x="760" y="1125" width="250" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8"/>
    <text x="885.0" y="1156" text-anchor="middle" class="node-title">格式化错误结果</text>
    <text x="885.0" y="1177" text-anchor="middle" class="node-subtitle">Token 脱敏；返回非零退出码</text>
  </g>
  <path id="e1" data-graph-role="edge" d="M330 180 H450" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e2" data-graph-role="edge" d="M670 180 H790" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e3" data-graph-role="edge" d="M900 215 V260 H350 V335" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e4" data-graph-role="edge" d="M530 392 H595" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="528.0" y="365" width="68" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="562" y="380" text-anchor="middle" class="edge-label" fill="#2563eb">目标环境</text>
  <path id="e5" data-graph-role="edge" d="M720 454 V484 H350 V510" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="727.0" y="459" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="746" y="474" text-anchor="middle" class="edge-label" fill="#16a34a">是</text>
  <path id="e6" data-graph-role="edge" d="M845 392 H940 V510" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="863.0" y="365" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="882" y="380" text-anchor="middle" class="edge-label" fill="#dc2626">否</text>
  <path id="e7" data-graph-role="edge" d="M530 546 H595" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e8" data-graph-role="edge" d="M720 608 V660 H260 V700" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="727.0" y="615" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="746" y="630" text-anchor="middle" class="edge-label" fill="#16a34a">是</text>
  <path id="e9" data-graph-role="edge" d="M845 546 H855" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="831.0" y="517" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="850" y="532" text-anchor="middle" class="edge-label" fill="#dc2626">否</text>
  <path id="e10" data-graph-role="edge" d="M400 739 H470" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e11" data-graph-role="edge" d="M710 739 H790" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="731.0" y="712" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="750" y="727" text-anchor="middle" class="edge-label" fill="#16a34a">是</text>
  <path id="e12" data-graph-role="edge" d="M590 801 V845" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="597.0" y="813" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="616" y="828" text-anchor="middle" class="edge-label" fill="#2563eb">否</text>
  <path id="e13" data-graph-role="edge" d="M905 778 V820 H670 V845" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="903.0" y="796" width="54" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="930" y="811" text-anchor="middle" class="edge-label" fill="#16a34a">已确认</text>
  <path id="e14" data-graph-role="edge" d="M730 888 H790" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path id="e15" data-graph-role="edge" d="M915 931 V945 H590" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="732.0" y="919" width="40" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="752" y="934" text-anchor="middle" class="edge-label" fill="#2563eb">响应</text>
  <path id="e16" data-graph-role="edge" d="M465 1010 H425 V1125" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="429.0" y="983" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="448" y="998" text-anchor="middle" class="edge-label" fill="#16a34a">是</text>
  <path id="e17" data-graph-role="edge" d="M715 1010 H885 V1125" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="729.0" y="983" width="38" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
  <text x="748" y="998" text-anchor="middle" class="edge-label" fill="#dc2626">否</text>
  <g transform="translate(72,1260)">
    <text x="0" y="0" class="note" font-weight="700">图例</text>
    <line x1="48" y1="-5" x2="88" y2="-5" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="98" y="0" class="note">主流程</text>
    <line x1="180" y1="-5" x2="220" y2="-5" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="230" y="0" class="note">有效 / 成功分支</text>
    <line x1="370" y1="-5" x2="410" y2="-5" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="420" y="0" class="note">失败分支</text>
  </g>
  <text x="1048" y="1295" text-anchor="end" class="note">同一 URL 的不同 Token 使用不同环境名称区分</text>
</svg>